---
services:
  web:
    build:
      context: ./web
      target: dev
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      - api_v1
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./web/package.json

  api_v1:
    build:
      context: ./api/v1
      target: dev
    environment:
      - DB_TYPE=sqlite
      - DB_PATH=/app/database/fairshare.db
      - NODE_ENV=development
    ports:
      - "3001:3001"
    volumes:
      - db-data:/app/database/
    develop:
      watch:
        - action: sync
          path: ./api/v1/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./api/v1/package.json

volumes:
  db-data:
