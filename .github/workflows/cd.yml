---
name: CD Pipeline

"on":
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/fairshare

permissions:
  contents: read

jobs:
  e2e-test:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Install Playwright
        run: npx playwright install --with-deps
        working-directory: ./web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./web
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:3000' }}

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ./web/playwright-report/
          retention-days: 3

  build-and-push-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - e2e-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-web:${{ github.sha }}

      - name: Build and push api/v1 image
        uses: docker/build-push-action@v7
        with:
          context: ./api/v1
          file: ./api/v1/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api-v1:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api-v1:${{ github.sha }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs:
      - build-and-push-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create env file for deployment
        run: |
          echo "GIT_COMMIT_HASH=${{ github.sha }}" >> ./envfile

      - name: Docker Stack deployment
        uses: cssnr/stack-deploy-action@v1
        with:
          name: fairshare
          file: docker-stack.yml
          host: ${{ secrets.DEPOLY_HOST }}
          user: ${{ secrets.DEPOLY_USER }}
          ssh_key: ${{ secrets.DEPOLY_SSH_KEY }}
          env_file: ./envfile
          registry_auth: true
          registry_host: ${{ env.REGISTRY }}
          registry_user: ${{ github.actor }}
          registry_pass: ${{ secrets.GITHUB_TOKEN }}
